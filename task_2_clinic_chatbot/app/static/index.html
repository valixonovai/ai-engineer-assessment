<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shifo Med — Virtual yordamchi</title>
<style>
  :root{
    --bg:#f6f7f9;
    --card:#ffffff;
    --ink:#111827;
    --muted:#6b7280;
    --line:#e5e7eb;
    --accent:#0f766e;
    --accent-soft:#e6f4f1;
    --user:#0f766e;
    --user-ink:#ffffff;
    --warn:#b45309;
    --warn-soft:#fef3c7;
    --danger:#b91c1c;
    --danger-soft:#fee2e2;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;justify-content:center;
  }
  .app{width:100%;max-width:820px;height:100vh;display:flex;flex-direction:column;background:var(--card);
       border-left:1px solid var(--line);border-right:1px solid var(--line)}
  header{
    display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);
    background:var(--card);flex:0 0 auto
  }
  .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;
        display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto}
  .brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .brand b{font-size:15px}
  .brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;
    padding:7px 11px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap
  }
  .btn:hover{background:#f3f4f6}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(.94)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  #log{flex:1 1 auto;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:10px;max-width:100%}
  .row.me{justify-content:flex-end}
  .bubble{
    max-width:min(88%,640px);padding:11px 14px;border-radius:var(--radius);
    background:#f3f4f6;white-space:pre-wrap;word-wrap:break-word
  }
  .row.me .bubble{background:var(--user);color:var(--user-ink);border-bottom-right-radius:5px}
  .row.bot .bubble{background:#f3f4f6;border-bottom-left-radius:5px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;font-size:11.5px;color:var(--muted)}
  .chip{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 7px}
  .chip.warn{background:var(--warn-soft);border-color:#fcd34d;color:var(--warn)}
  .chip.danger{background:var(--danger-soft);border-color:#fca5a5;color:var(--danger)}
  .chip.ok{background:var(--accent-soft);border-color:#99e0d6;color:var(--accent)}
  .empty{margin:auto;text-align:center;max-width:560px;color:var(--muted)}
  .empty h1{font-size:19px;color:var(--ink);margin:0 0 6px}
  .empty p{margin:0 0 18px;font-size:14px}
  .sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .sugg button{
    border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;
    font-size:13px;cursor:pointer;color:var(--ink)
  }
  .sugg button:hover{background:var(--accent-soft);border-color:#99e0d6}
  .dots span{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;
             background:var(--muted);animation:b 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.15s}
  .dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
  footer{border-top:1px solid var(--line);padding:12px 18px 16px;background:var(--card);flex:0 0 auto}
  .composer{display:flex;gap:10px;align-items:flex-end}
  textarea{
    flex:1 1 auto;resize:none;border:1px solid var(--line);border-radius:11px;padding:11px 13px;
    font:inherit;max-height:140px;min-height:44px;outline:none
  }
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .hint{margin-top:8px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
  @media (max-width:520px){
    .app{border:none}
    .brand span{ display:none }
    #log{padding:16px 12px}
    footer{padding:10px 12px 14px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">SM</div>
    <div class="brand">
      <b>Shifo Med — Virtual yordamchi</b>
      <span id="model">yuklanmoqda…</span>
    </div>
    <div class="head-actions">
      <a class="btn" href="/docs" target="_blank" rel="noopener">Swagger</a>
      <button class="btn" id="reset" type="button">Yangi suhbat</button>
    </div>
  </header>

  <main id="log" aria-live="polite"></main>

  <footer>
    <div class="composer">
      <textarea id="msg" rows="1" placeholder="Savolingizni yozing… (Enter — yuborish, Shift+Enter — yangi qator)"></textarea>
      <button class="btn primary" id="send" type="button">Yuborish</button>
    </div>
    <div class="hint">
      <span>Chatbot tashxis qo'ymaydi va dori tavsiya qilmaydi. Shoshilinch holatda — 103.</span>
      <span id="sid"></span>
    </div>
  </footer>
</div>

<script>
(function () {
  "use strict";
  const log = document.getElementById("log");
  const box = document.getElementById("msg");
  const sendBtn = document.getElementById("send");
  const resetBtn = document.getElementById("reset");
  const modelEl = document.getElementById("model");
  const sidEl = document.getElementById("sid");
  const KEY = "shifomed_session_id";

  const SUGGESTIONS = [
    "Klinika qayerda joylashgan?",
    "Kardiolog qabuli qancha turadi?",
    "Aziz Karimov qabul kunlari qanday?",
    "Check-up paketida nima bor?",
    "Qabulga yozilmoqchiman"
  ];

  let sessionId = localStorage.getItem(KEY) || null;
  let busy = false;

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function renderSession() {
    sidEl.textContent = sessionId ? "sessiya: " + sessionId : "";
  }

  function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }

  function scrollDown(force) {
    if (force || atBottom()) log.scrollTop = log.scrollHeight;
  }

  function addBubble(role, text) {
    const row = el("div", "row " + (role === "me" ? "me" : "bot"));
    const bubble = el("div", "bubble", text);
    row.appendChild(bubble);
    log.appendChild(row);
    scrollDown(true);
    return { row, bubble };
  }

  function addMeta(bubble, data) {
    const chips = [];
    const s = data.safety || {};
    if (s.emergency) chips.push(["danger", "Shoshilinch holat → 103"]);
    if (s.refused_medical_advice) chips.push(["warn", "Tibbiy maslahat rad etildi"]);
    if (s.injection_attempt) chips.push(["warn", "Qoida o'zgartirishga urinish"]);
    if (s.grounding_violation) chips.push(["warn", "Javob bilim bazasidan tiklandi"]);
    (data.sources || []).forEach(function (src) {
      chips.push(["ok", src.id]);
    });
    if (!chips.length) return;
    const meta = el("div", "meta");
    chips.forEach(function (c) {
      meta.appendChild(el("span", "chip " + c[0], c[1]));
    });
    bubble.appendChild(meta);
  }

  function showEmpty() {
    log.innerHTML = "";
    const wrap = el("div", "empty");
    wrap.appendChild(el("h1", null, "Assalomu alaykum!"));
    wrap.appendChild(el("p", null,
      "Shifo Med klinikasi haqida so'rang: shifokorlar, xizmatlar, narxlar, ish vaqti yoki qabulga yozilish."));
    const sugg = el("div", "sugg");
    SUGGESTIONS.forEach(function (text) {
      const b = el("button", null, text);
      b.type = "button";
      b.addEventListener("click", function () { send(text); });
      sugg.appendChild(b);
    });
    wrap.appendChild(sugg);
    log.appendChild(wrap);
  }

  function setBusy(state) {
    busy = state;
    sendBtn.disabled = state;
    box.disabled = state;
  }

  async function send(forced) {
    const text = (forced !== undefined ? forced : box.value).trim();
    if (!text || busy) return;
    if (log.querySelector(".empty")) log.innerHTML = "";
    box.value = "";
    box.style.height = "auto";
    addBubble("me", text);
    setBusy(true);

    const row = el("div", "row bot");
    const bubble = el("div", "bubble");
    const dots = el("span", "dots");
    dots.innerHTML = "<span></span><span></span><span></span>";
    bubble.appendChild(dots);
    row.appendChild(bubble);
    log.appendChild(row);
    scrollDown(true);

    try {
      const resp = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(sessionId ? { message: text, session_id: sessionId } : { message: text })
      });
      if (!resp.ok) {
        const detail = await resp.text();
        throw new Error("HTTP " + resp.status + " — " + detail.slice(0, 200));
      }
      const data = await resp.json();
      sessionId = data.session_id;
      localStorage.setItem(KEY, sessionId);
      renderSession();
      bubble.textContent = data.reply;
      addMeta(bubble, data);
    } catch (err) {
      bubble.textContent = "Xatolik: serverga ulanib bo'lmadi.\n" + String(err.message || err);
      bubble.classList.add("err");
    } finally {
      setBusy(false);
      scrollDown();
      box.focus();
    }
  }

  function reset() {
    const current = sessionId;
    sessionId = null;
    localStorage.removeItem(KEY);
    renderSession();
    showEmpty();
    if (current) {
      fetch("/chat/reset?session_id=" + encodeURIComponent(current), { method: "POST" }).catch(function () {});
    }
    box.focus();
  }

  box.addEventListener("input", function () {
    box.style.height = "auto";
    box.style.height = Math.min(box.scrollHeight, 140) + "px";
  });
  box.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", function () { send(); });
  resetBtn.addEventListener("click", reset);

  async function boot() {
    try {
      const r = await fetch("/health");
      const h = await r.json();
      const llm = h.llm || {};
      modelEl.textContent = llm.available
        ? llm.provider + " · " + llm.model
        : "model sozlanmagan — .env ga API kalit qo'ying";
    } catch (e) {
      modelEl.textContent = "server holati aniqlanmadi";
    }
    renderSession();
    showEmpty();
    box.focus();
  }

  boot();
})();
</script>
</body>
</html>
